# Render Blueprint - Infrastructure as Code for Render.com deployment
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: cocoa-price-tracker
    runtime: python
    region: oregon  # or your preferred region

    # Build configuration
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT

    # Environment variables (set these in Render dashboard for secrets)
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: GROQ_API_KEY
        sync: false  # Set manually in dashboard
      - key: CACHE_TTL
        value: "3600"
      - key: NEWS_LIMIT
        value: "20"
      - key: ENVIRONMENT
        value: "production"

    # Health check
    healthCheckPath: /health

    # Scaling (free tier settings)
    plan: free  # or starter, standard based on needs

    # Auto-deploy on push
    autoDeploy: true
